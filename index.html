<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCI CAFM</title>
<style>
:root{
  --bg1:#3d0a18; --bg2:#1a050e; --bg3:#0e0d20; --bg4:#1a0a32;
  --primary:#c0142a; --primary-rgb:192,20,42; --header:#611426;
  --glass-bg:rgba(255,255,255,0.08); --glass-bg-2:rgba(255,255,255,0.12);
  --glass-border:rgba(255,255,255,0.13); --glass-blur:28px;
  --sidebar-bg:rgba(16,4,10,0.55);
  --text:#f5f0f2; --text-dim:rgba(245,240,242,0.62); --text-dim2:rgba(245,240,242,0.4);
  --radius:16px; --radius-sm:10px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fs:14px;
  --row-gap:10px;
  --st-overdue:#e5484d; --st-duesoon:#f5a623; --st-watch:#f7d716; --st-compliant:#3fbb6d; --st-nodate:#9098a6;
  --st-renewal:#5b8def; --st-quote:#b478e8;
  --shadow: 0 8px 32px rgba(0,0,0,0.35);
}
[data-statusset="accessible"]{
  --st-overdue:#0072B2; --st-duesoon:#E69F00; --st-watch:#56B4E9; --st-compliant:#009E73; --st-nodate:#8a8f98;
}
*{box-sizing:border-box; margin:0; padding:0; min-width:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  font-size:var(--fs);
  color:var(--text);
  background:
    radial-gradient(ellipse 60% 50% at 20% 15%, rgba(192,20,42,0.16), transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 80%, rgba(90,30,160,0.18), transparent 60%),
    linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 35%, var(--bg3) 65%, var(--bg4) 100%);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.orb{position:fixed; border-radius:50%; filter:blur(70px); opacity:0.55; z-index:0; pointer-events:none;}
.orb1{width:480px;height:480px; background:radial-gradient(circle, rgba(192,20,42,0.55), transparent 70%); top:-120px; left:-100px; animation:driftA 26s ease-in-out infinite;}
.orb2{width:520px;height:520px; background:radial-gradient(circle, rgba(90,60,220,0.45), transparent 70%); bottom:-160px; right:-120px; animation:driftB 32s ease-in-out infinite;}
@keyframes driftA{0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,80px);}}
@keyframes driftB{0%,100%{transform:translate(0,0);} 50%{transform:translate(-70px,-50px);}}

.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(140%);
  border:0.5px solid var(--glass-border);
  border-radius:var(--radius);
  position:relative;
  box-shadow:var(--shadow);
}
.glass::before{
  content:"";
  position:absolute; top:0; left:12%; right:12%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  border-radius:1px;
}

[hidden]{display:none !important;}
svg{width:16px; height:16px; flex-shrink:0; display:inline-block; vertical-align:middle;}
svg.icon-lg{width:22px; height:22px;}
svg.donut-svg{width:130px !important; height:130px !important;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; padding:0; -webkit-appearance:none; appearance:none;}
input,select,textarea{font-family:inherit; font-size:inherit; color:var(--text);}
a{color:inherit;}

/* ---------- Login ---------- */
#login-screen{
  position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{width:100%; max-width:380px; padding:36px 32px; text-align:center;}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg, var(--primary), var(--header)); margin:0 auto 18px; display:flex;align-items:center;justify-content:center; box-shadow:0 8px 24px rgba(192,20,42,0.4);}
.login-title{font-size:20px; font-weight:700; letter-spacing:0.2px;}
.login-sub{font-size:13px; color:var(--text-dim); margin-top:4px; margin-bottom:26px;}
.field{text-align:left; margin-bottom:16px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.field select, .field input, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.06); border:0.5px solid var(--glass-border); color:var(--text); outline:none;
}
.field select:focus, .field input:focus, .field textarea:focus{border-color:rgba(var(--primary-rgb),0.7); background:rgba(255,255,255,0.09);}
.field select option{background:#2a0e18; color:var(--text);}
.field input[type=password]{letter-spacing:4px; font-size:18px;}
.btn{
  padding:11px 18px; border-radius:var(--radius-sm); border:0.5px solid var(--glass-border);
  background:rgba(255,255,255,0.08); color:var(--text); font-size:13.5px; font-weight:600; transition:all .15s;
}
.btn:hover{background:rgba(255,255,255,0.14);}
.btn-primary{background:linear-gradient(135deg, var(--primary), var(--header)); border-color:transparent; box-shadow:0 6px 18px rgba(var(--primary-rgb),0.35);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-block{width:100%;}
.btn-danger{background:rgba(229,72,77,0.18); border-color:rgba(229,72,77,0.4); color:#ff9296;}
.btn-ghost{background:transparent;}
.btn-sm{padding:7px 12px; font-size:12px;}
.login-error{color:#ff9296; font-size:12.5px; margin-bottom:14px; min-height:1px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh; position:relative; z-index:1;}
#sidebar{
  width:220px; flex:0 0 220px; background:var(--sidebar-bg); backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px); border-right:0.5px solid var(--glass-border);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:100;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px;}
.brand-logo{width:34px;height:34px;border-radius:10px; background:linear-gradient(145deg,var(--primary),var(--header)); flex:0 0 34px; display:flex;align-items:center;justify-content:center; overflow:hidden;}
.brand-logo svg{width:20px;height:20px;}
.login-logo svg{width:32px;height:32px;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-text{overflow:hidden;}
.brand-name{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-strap{font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.nav-scroll{flex:1; overflow-y:auto; padding:6px 10px;}
.nav-group{margin-top:14px;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim2); padding:0 10px 6px; font-weight:700;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:11px; margin-bottom:3px;
  color:var(--text-dim); font-size:13.2px; font-weight:500; border:0.5px solid transparent; transition:all .15s; position:relative;
}
.nav-item:hover{background:rgba(255,255,255,0.06); color:var(--text);}
.nav-item.active{background:rgba(var(--primary-rgb),0.35); border-color:rgba(var(--primary-rgb),0.55); color:#fff; font-weight:600;}
.nav-item svg{flex:0 0 16px; width:16px; height:16px;}
.nav-item .badge{margin-left:auto; background:rgba(229,72,77,0.85); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px;}

.sidebar-footer{padding:12px; border-top:0.5px solid var(--glass-border);}
.user-widget{display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px;}
.avatar{width:32px;height:32px;border-radius:50%; background:linear-gradient(145deg,var(--primary),var(--header)); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; flex:0 0 32px;}
.user-widget-name{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-widget-role{font-size:10.5px; color:var(--text-dim);}
.signout-btn{margin-left:auto; width:28px;height:28px; border-radius:8px; display:flex;align-items:center;justify-content:center; background:rgba(255,255,255,0.06); border:0.5px solid var(--glass-border);}
.signout-btn:hover{background:rgba(229,72,77,0.2);}

#main{flex:1; margin-left:220px; display:flex; flex-direction:column; min-height:100vh; min-width:0;}
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px; padding:14px 26px;
  background:rgba(20,8,16,0.45); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-bottom:0.5px solid var(--glass-border);
}
#topbar h1{font-size:18px; font-weight:700;}
#topbar .top-sub{font-size:12px; color:var(--text-dim);}
.topbar-spacer{flex:1;}
#content{padding:22px 26px 60px; flex:1;}

.mobile-toggle{display:none;}

/* ---------- Cards / grids ---------- */
.card{padding:18px;}
.grid{display:grid; gap:14px;}
.kpi-grid{grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:20px;}
.kpi{padding:14px 16px; overflow:hidden; border-left:3px solid rgba(255,255,255,0.15);}
.kpi.alert{border-left-color:var(--st-overdue);}
.kpi.warn{border-left-color:var(--st-duesoon);}
.kpi-glow{position:absolute; top:-30px; right:-30px; width:90px;height:90px; border-radius:50%; filter:blur(24px); opacity:0.5;}
.kpi-num{font-size:26px; font-weight:800; line-height:1;}
.kpi-label{font-size:11.5px; color:var(--text-dim); margin-top:6px; font-weight:600;}

.panels-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;}
.panel{padding:0; overflow:hidden;}
.panel-head{padding:16px 18px; border-bottom:0.5px solid var(--glass-border); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-size:14.5px; font-weight:700;}
.panel-body{padding:6px 8px;}
.stat-row{display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:10px;}
.stat-row:hover{background:rgba(255,255,255,0.05);}
.chip{width:30px;height:30px;border-radius:9px; display:flex;align-items:center;justify-content:center; flex:0 0 30px;}
.stat-row-label{font-size:13px; font-weight:500; flex:1;}
.stat-row-count{font-size:14px; font-weight:700;}
.stat-row-pct{font-size:11px; color:var(--text-dim); width:38px; text-align:right;}
.panel-foot{padding:12px 18px; border-top:0.5px solid var(--glass-border); text-align:right;}
.link-btn{background:none;border:none;color:var(--primary); font-size:12.5px; font-weight:700;}
.link-btn:hover{text-decoration:underline;}

.donuts-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;}
.donut-card{padding:18px; display:flex; gap:18px; align-items:center;}
.legend{display:flex; flex-direction:column; gap:6px; font-size:12px;}
.legend-item{display:flex; align-items:center; gap:7px;}
.legend-dot{width:9px;height:9px;border-radius:50%;}

.urgent-list{padding:6px;}
.urgent-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-left:3px solid var(--st-nodate); border-radius:10px; margin:4px 4px;}
.urgent-item:hover{background:rgba(255,255,255,0.05); cursor:pointer;}
.urgent-rank{font-size:11px; color:var(--text-dim2); width:16px; font-weight:700;}
.urgent-main{flex:1; min-width:0;}
.urgent-task{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.urgent-sub{font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; background:rgba(255,255,255,0.08); border:0.5px solid var(--glass-border); white-space:nowrap;}
.pill-dot{width:7px;height:7px;border-radius:50%;}
.pill-overdue{color:var(--st-overdue);} .pill-overdue .pill-dot{background:var(--st-overdue);}
.pill-duesoon{color:var(--st-duesoon);} .pill-duesoon .pill-dot{background:var(--st-duesoon);}
.pill-watch{color:var(--st-watch);} .pill-watch .pill-dot{background:var(--st-watch);}
.pill-compliant{color:var(--st-compliant);} .pill-compliant .pill-dot{background:var(--st-compliant);}
.pill-nodate{color:var(--st-nodate);} .pill-nodate .pill-dot{background:var(--st-nodate);}

/* ---------- Toolbar / table ---------- */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.search-input{padding:9px 14px; border-radius:20px; background:rgba(255,255,255,0.07); border:0.5px solid var(--glass-border); min-width:220px; outline:none;}
.filter-chip{padding:7px 13px; border-radius:16px; background:rgba(255,255,255,0.06); border:0.5px solid var(--glass-border); font-size:12px; color:var(--text-dim); font-weight:600;}
.filter-chip.active{background:rgba(var(--primary-rgb),0.35); border-color:rgba(var(--primary-rgb),0.6); color:#fff;}
.tb-spacer{flex:1;}

.table-wrap{overflow-x:auto; border-radius:var(--radius);}
table{width:100%; border-collapse:collapse; font-size:12.8px;}
thead th{text-align:left; padding:11px 12px; color:var(--text-dim); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; border-bottom:0.5px solid var(--glass-border); white-space:nowrap;}
tbody tr{border-bottom:0.5px solid rgba(255,255,255,0.06); transition:background .12s;}
tbody tr:hover{background:rgba(255,255,255,0.05); cursor:pointer;}
tbody td{padding:10px 12px; white-space:nowrap;}
td.wrap{white-space:normal;}
.row-del{opacity:0; background:rgba(229,72,77,0.15); border:0.5px solid rgba(229,72,77,0.4); color:#ff9296; width:24px;height:24px;border-radius:7px; font-size:13px; line-height:1;}
tbody tr:hover .row-del{opacity:1;}
.checkbox-cell{width:34px;}

.bulk-bar{
  position:sticky; bottom:14px; margin-top:14px; padding:12px 18px; display:flex; align-items:center; gap:14px;
  background:rgba(var(--primary-rgb),0.35); border:0.5px solid rgba(var(--primary-rgb),0.55); backdrop-filter:blur(24px);
  border-radius:var(--radius); animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(16px); opacity:0;} to{transform:translateY(0);opacity:1;}}

/* ---------- Drawer / overlay / modal / toast ---------- */
#overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:400; opacity:0; pointer-events:none; transition:opacity .2s;}
#overlay.show{opacity:1; pointer-events:auto;}
#drawer{
  position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; z-index:410;
  background:rgba(14,6,12,0.72); backdrop-filter:blur(34px) saturate(150%); -webkit-backdrop-filter:blur(34px) saturate(150%);
  border-left:0.5px solid var(--glass-border); transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,0.4);
}
#drawer.open{transform:translateX(0);}
.drawer-head{padding:20px 22px 14px; border-bottom:0.5px solid var(--glass-border);}
.drawer-head-row{display:flex; align-items:center; justify-content:space-between;}
.drawer-title{font-size:16.5px; font-weight:700;}
.drawer-sub{font-size:12px; color:var(--text-dim); margin-top:5px;}
.drawer-close{width:28px;height:28px;border-radius:8px; background:rgba(255,255,255,0.06); border:0.5px solid var(--glass-border); display:flex;align-items:center;justify-content:center;}
.drawer-body{flex:1; overflow-y:auto; padding:18px 22px;}
.drawer-foot{padding:16px 22px; border-top:0.5px solid var(--glass-border); display:flex; gap:10px;}
.drawer-foot .btn{flex:1;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
.field textarea{resize:vertical; min-height:70px;}

#modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{width:100%; max-width:420px; padding:24px;}
.modal h3{font-size:16px; margin-bottom:8px;}
.modal p{font-size:13px; color:var(--text-dim); margin-bottom:18px; line-height:1.5;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end;}

#toast-stack{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:600; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600; animation:toastIn .2s ease; display:flex; align-items:center; gap:10px;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Calendar ---------- */
.cal-layout{display:grid; grid-template-columns:1fr 300px; gap:16px; min-width:0;}
.cal-layout>div{min-width:0;}
.cal-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.cal-title{font-size:16px; font-weight:700; min-width:170px;}
.cal-nav-btn{width:32px;height:32px;padding:0;border-radius:9px; display:flex;align-items:center;justify-content:center;}
.cal-nav-btn svg{width:16px;height:16px;}
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:rgba(255,255,255,0.06); border-radius:var(--radius); overflow:hidden; border:0.5px solid var(--glass-border);}
.month-head{padding:8px; text-align:center; font-size:10.5px; font-weight:700; color:var(--text-dim); background:rgba(255,255,255,0.03); text-transform:uppercase;}
.month-cell{background:rgba(10,4,8,0.35); min-height:96px; min-width:0; padding:6px; display:flex; flex-direction:column; gap:3px; cursor:pointer; overflow:hidden;}
.month-cell:hover{background:rgba(255,255,255,0.05);}
.month-cell.other{opacity:0.35;}
.month-cell.selected{outline:1.5px solid var(--primary); outline-offset:-1.5px;}
.cell-date{width:22px;height:22px; border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:11.5px; font-weight:600;}
.cell-date.today{background:linear-gradient(135deg,var(--primary),var(--header)); color:#fff;}
.evt-chip{font-size:9.5px; padding:2px 5px; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
.evt-more{font-size:9.5px; color:var(--text-dim); padding:1px 4px;}

.week-grid{display:grid; grid-template-columns:44px repeat(7,1fr); border:0.5px solid var(--glass-border); border-radius:var(--radius); overflow:hidden;}
.week-head-cell{padding:8px 4px; text-align:center; font-size:10.5px; font-weight:700; background:rgba(255,255,255,0.04); border-bottom:0.5px solid var(--glass-border);}
.week-time{font-size:9.5px; color:var(--text-dim2); padding:4px; text-align:right; border-right:0.5px solid var(--glass-border);}
.week-cell{min-height:44px; min-width:0; border-right:0.5px solid rgba(255,255,255,0.05); border-bottom:0.5px solid rgba(255,255,255,0.05); padding:2px; overflow:hidden;}

.mini-month{padding:14px;}
.mini-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:10px; text-align:center;}
.mini-grid div{padding:4px 0; border-radius:6px;}
.mini-day{cursor:pointer;}
.mini-day:hover{background:rgba(255,255,255,0.08);}
.mini-day.today{background:rgba(var(--primary-rgb),0.4); font-weight:700;}

.day-panel{padding:16px;}
.day-panel h4{font-size:13.5px; margin-bottom:10px;}
.day-evt{padding:9px 10px; border-radius:10px; margin-bottom:6px; font-size:12px; cursor:pointer; border-left:3px solid;}
.day-evt:hover{background:rgba(255,255,255,0.06);}

.cal-summary{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;}
.summary-pill{padding:8px 14px; font-size:12px; font-weight:600;}

/* ---------- Add asset ---------- */
.mode-toggle{display:inline-flex; padding:3px; border-radius:14px; margin-bottom:18px;}
.mode-btn{padding:8px 16px; border-radius:11px; font-size:12.5px; font-weight:600; background:none; border:none; color:var(--text-dim);}
.mode-btn.active{background:rgba(var(--primary-rgb),0.4); color:#fff;}
.added-list{margin-top:16px;}
.added-item{display:flex; align-items:center; gap:12px; padding:10px 14px; margin-bottom:6px;}
.preview-table{margin-top:14px;}
.remove-banner{padding:14px 18px; display:flex; align-items:center; gap:14px; margin-bottom:18px; border-left:3px solid var(--st-duesoon);}
.quick-add-row{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}

/* ---------- Cost analysis ---------- */
.cost-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.cost-card{padding:18px;}
.cost-card h3{font-size:14px; margin-bottom:12px;}
.cost-row{display:flex; justify-content:space-between; padding:7px 0; font-size:12.5px; border-bottom:0.5px solid rgba(255,255,255,0.06);}
.cost-row b{font-weight:700;}
.bar-track{height:7px; border-radius:5px; background:rgba(255,255,255,0.08); overflow:hidden; margin-top:4px;}
.bar-fill{height:100%; border-radius:5px;}

/* ---------- Appearance ---------- */
.appearance-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.swatch-row{display:flex; gap:10px; flex-wrap:wrap;}
.swatch{width:52px;height:52px;border-radius:14px; border:2px solid transparent; cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center;}
.swatch.selected{border-color:#fff;}
.opt-pill-row{display:flex; gap:8px; flex-wrap:wrap;}
.opt-pill{padding:8px 14px; border-radius:12px; font-size:12px; font-weight:600; background:rgba(255,255,255,0.06); border:0.5px solid var(--glass-border); color:var(--text-dim);}
.opt-pill.selected{background:rgba(var(--primary-rgb),0.4); color:#fff; border-color:rgba(var(--primary-rgb),0.6);}
.logo-drop{border:1.5px dashed var(--glass-border); border-radius:14px; padding:22px; text-align:center; font-size:12px; color:var(--text-dim); cursor:pointer;}

/* ---------- User management ---------- */
.user-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
.user-card{padding:16px; text-align:center;}
.user-card .avatar{width:52px;height:52px; font-size:16px; margin:0 auto 10px;}
.role-badge{display:inline-block; font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px; margin-top:6px; text-transform:uppercase; letter-spacing:0.4px;}
.role-badge.admin{background:rgba(var(--primary-rgb),0.35); color:#ffb3bd;}
.role-badge.staff{background:rgba(91,141,239,0.3); color:#9ec1ff;}
.pin-warn{font-size:10.5px; color:var(--st-duesoon); margin-top:6px;}
.user-card-actions{display:flex; gap:6px; margin-top:12px;}
.perm-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.perm-item{display:flex; align-items:center; gap:8px; font-size:12px; padding:6px 8px; border-radius:8px; background:rgba(255,255,255,0.04);}

/* ---------- Guide ---------- */
.guide-prose{max-width:760px; line-height:1.7; font-size:13.5px; color:var(--text-dim);}
.guide-prose h3{color:var(--text); font-size:15px; margin:22px 0 8px;}
.guide-prose ol,.guide-prose ul{margin-left:20px; margin-bottom:10px;}
.guide-prose li{margin-bottom:4px;}
.settings-num-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:16px 0 24px;}
.danger-zone{margin-top:24px; padding:16px; border:0.5px solid rgba(229,72,77,0.3);}
.data-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .kpi-grid{grid-template-columns:repeat(3,1fr);}
  .panels-row, .donuts-row, .cost-grid, .cal-layout{grid-template-columns:1fr;}
  .appearance-grid{grid-template-columns:1fr;}
}
@media print{
  #sidebar, #topbar, #overlay, #drawer, #modal-overlay, #toast-stack, .toolbar, .quick-add-row, .mode-toggle{display:none !important;}
  #main{margin-left:0 !important;}
  body{background:#fff !important; color:#111 !important;}
  .glass{background:#fff !important; border:1px solid #ccc !important; box-shadow:none !important; backdrop-filter:none !important;}
}
@media (max-width:760px){
  #sidebar{position:fixed; left:0; right:0; top:0; bottom:auto; width:100%; height:64px; flex-direction:row; border-right:none; border-bottom:0.5px solid var(--glass-border);}
  .brand{padding:0 12px;}
  .brand-strap{display:none;}
  .nav-scroll{display:flex; flex-direction:row; overflow-x:auto; padding:8px 6px; flex:1;}
  .nav-group{margin-top:0; display:flex; gap:4px; flex-shrink:0;}
  .nav-group-label{display:none;}
  .nav-item{flex-direction:column; gap:2px; font-size:9.5px; padding:6px 10px; white-space:nowrap; flex-shrink:0;}
  .sidebar-footer{display:none;}
  #main{margin-left:0; margin-top:64px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  #content{padding:16px;}
  .form-grid{grid-template-columns:1fr;}
  #drawer{width:100%; max-width:100%;}
}

function hasPerm(key){ if(!SESSION) return false; if(SESSION.role==='admin') return true; return !!(SESSION.permissions && SESSION.permissions[key]); }

const FREQ_STEP = {Weekly:{u:'d',n:7}, Monthly:{u:'m',n:1}, Quarterly:{u:'m',n:3}, 'Six-monthly':{u:'m',n:6}, Annual:{u:'m',n:12}, Biennial:{u:'m',n:24}, Triennial:{u:'m',n:36}, Quinquennial:{u:'m',n:60}};
function nextDueDate(task){ if(!task.lastCompleted) return ''; const f=FREQ_STEP[task.frequency]||{u:'m',n:12}; const base=new Date(task.lastCompleted+'T00:00:00'); const d=f.u==='d'?addDays(base,f.n):addMonths(base,f.n); return iso(d); }
function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function statusFromDate(dateStr){ if(!dateStr) return 'nodate'; const d=daysUntil(dateStr); const s=DB.settings; if(d<0) return 'overdue'; if(d<=s.soon) return 'duesoon'; if(d<=s.watch) return 'watch'; return 'compliant'; }
function maintenanceStatus(task){ return statusFromDate(nextDueDate(task)); }
function renewalStatus(r){ return statusFromDate(r.expiryDate); }
function renewalReviewDate(r){ if(!r.expiryDate) return ''; return iso(addDays(new Date(r.expiryDate+'T00:00:00'), -((Number(r.noticeDays)||0)+(DB.settings.lead||0)))); }
function quoteTotal(q){ return (Number(q.exVat)||0)+(Number(q.vat)||0); }
function quoteVariance(q){ if(q.invoiceAmount===''||q.invoiceAmount==null) return null; return Number(q.invoiceAmount)-Number(q.exVat||0); }
function quoteVariancePct(q){ const v=quoteVariance(q); if(v==null||!Number(q.exVat)) return null; return (v/Number(q.exVat))*100; }

const STATUS_LABEL = {overdue:'Overdue', duesoon:'Due soon', watch:'Watch', compliant:'Compliant', nodate:'No date'};
function statusPill(status){ return '<span class="pill pill-'+status+'"><span class="pill-dot"></span>'+STATUS_LABEL[status]+'</span>'; }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ if(n===''||n==null||isNaN(n)) return '—'; return '£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(prefix){ return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function nextAssetId(category){ const code=CAT_CODE[category]; if(!code) return ''; const nums=DB.assets.filter(a=>a.id.startsWith(code+'-')).map(a=>parseInt(a.id.split('-')[1],10)).filter(n=>!isNaN(n)); const next=(nums.length?Math.max(...nums):0)+1; return code+'-'+String(next).padStart(3,'0'); }

function exportCSV(rows, columns, filename){
  const header = columns.map(c=>'"'+c.label.replace(/"/g,'""')+'"').join(',');
  const lines = rows.map(r=>columns.map(c=>{ let v=c.get(r); if(v==null) v=''; return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
  const csv = [header].concat(lines).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Exported '+rows.length+' rows to CSV', 'success');
}

function donutSVG(segments){
  const total = segments.reduce((s,x)=>s+x.value,0)||1;
  const r=40, cx=50, cy=50, circ=2*Math.PI*r;
  let offset=0, circles='';
  segments.forEach(seg=>{
    if(seg.value<=0) return;
    const len=(seg.value/total)*circ;
    circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="14" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
  });
  return '<svg class="donut-svg" viewBox="0 0 100 100" width="130" height="130">'+circles+'<text x="50" y="54" text-anchor="middle" font-size="15" fill="var(--text)" font-weight="700">'+total+'</text></svg>';
}
function legendHTML(segments){
  return '<div class="legend">'+segments.map(s=>'<div class="legend-item"><span class="legend-dot" style="background:'+s.color+'"></span>'+s.label+' <span style="color:var(--text-dim)">('+s.value+')</span></div>').join('')+'</div>';
}

const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

function monthMatrix(year, month){
  const first = new Date(Date.UTC(year, month, 1));
  let startDow = first.getUTCDay(); startDow = startDow===0?6:startDow-1;
  const gridStart = new Date(Date.UTC(year, month, 1 - startDow));
  const cells=[];
  for(let i=0;i<42;i++) cells.push(new Date(Date.UTC(gridStart.getUTCFullYear(), gridStart.getUTCMonth(), gridStart.getUTCDate()+i)));
  return cells;
}
function eventsOn(dateStr, evts){ return evts.filter(e=>e.date===dateStr); }

function renderCalMonth(){
  const cal=UI.calendar;
  const y=cal.date.getUTCFullYear? cal.date.getUTCFullYear():cal.date.getFullYear();
  const m=cal.date.getUTCMonth? cal.date.getUTCMonth():cal.date.getMonth();
  document.getElementById('cal-title').textContent = MONTH_NAMES[m]+' '+y;
  const cells = monthMatrix(y,m);
  const evts = calendarEvents();
  const todayStr = iso(TODAY);
  let html = '<div class="month-grid glass">';
  DOW_NAMES.forEach(d=>html+='<div class="month-head">'+d+'</div>');
  cells.forEach(cellDate=>{
    const ds = iso(cellDate);
    const inMonth = cellDate.getUTCMonth()===m;
    const dayEvts = eventsOn(ds, evts);
    const shown = dayEvts.slice(0,3);
    const more = dayEvts.length-3;
    html += `<div class="month-cell${inMonth?'':' other'}${cal.selectedDay===ds?' selected':''}" data-action="cal-select-day" data-id="${ds}">
      <div class="cell-date${ds===todayStr?' today':''}">${cellDate.getUTCDate()}</div>

      ${more>0?`<div class="evt-more">+${more} more</div>`:''}
    </div>`;
  });
  html += '</div>';
  document.getElementById('cal-main').innerHTML = html;
  document.getElementById('cal-sidebar').innerHTML = renderDayPanel(evts);
}
function renderCalWeek(){
  const cal=UI.calendar;
  const d = new Date(cal.date);
  let dow = d.getUTCDay(); dow = dow===0?6:dow-1;
  const weekStart = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()-dow));
  const days = [...Array(7)].map((_,i)=> new Date(Date.UTC(weekStart.getUTCFullYear(), weekStart.getUTCMonth(), weekStart.getUTCDate()+i)));
  document.getElementById('cal-title').textContent = fmtDate(iso(days[0]))+' – '+fmtDate(iso(days[6]));
  const evts = calendarEvents();
  const todayStr = iso(TODAY);
  let html = '<div class="week-grid glass"><div class="week-head-cell"></div>';
  days.forEach(dt=>{ const ds=iso(dt); html+=`<div class="week-head-cell${ds===todayStr?' today':''}" data-action="cal-select-day" data-id="${ds}">${DOW_NAMES[dt.getUTCDay()===0?6:dt.getUTCDay()-1]}<br><span style="font-size:13px;">${dt.getUTCDate()}</span></div>`; });
  html += '<div class="week-time">All day</div>';
  days.forEach(dt=>{
    const ds=iso(dt);
    const dayEvts=eventsOn(ds,evts);
    html += `<div class="week-cell" data-action="cal-select-day" data-id="${ds}">${dayEvts.map(e=>`<div class="evt-chip" style="background:${e.color}33;color:${e.color};margin-bottom:2px;" data-action="cal-open-evt" data-id="${e.type}|${e.refId}|${e.date}">${esc(e.title)}</div>`).join('')}</div>`;
  });
  html += '</div>';
  document.getElementById('cal-main').innerHTML = html;
  document.getElementById('cal-sidebar').innerHTML = renderMiniMonth() + renderDayPanel(evts);
}
function renderMiniMonth(){
  const cal=UI.calendar;
  const y=cal.date.getUTCFullYear(), m=cal.date.getUTCMonth();
  const cells=monthMatrix(y,m);
  const todayStr=iso(TODAY);
  return `<div class="glass mini-month" style="margin-bottom:14px;">
    <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">${MONTH_NAMES[m]} ${y}</div>
    <div class="mini-grid">
      ${DOW_NAMES.map(d=>'<div style="color:var(--text-dim);">'+d[0]+'</div>').join('')}
      ${cells.map(c=>{const ds=iso(c); return `<div class="mini-day${ds===todayStr?' today':''}" data-action="cal-jump-day" data-id="${ds}" style="${c.getUTCMonth()!==m?'opacity:.35;':''}">${c.getUTCDate()}</div>`;}).join('')}
    </div>
  </div>`;
}
function renderDayPanel(evts){
  const cal=UI.calendar;

  return `<div class="glass day-panel">

}
function renderCalSummary(){

function formField(f){
  const cls = f.full?' full':'';
  let input;
  const val = f.value==null?'':f.value;
  if(f.type==='select'){
    input = `<select id="f_${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}" ${String(o)===String(val)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="f_${f.key}">${esc(val)}</textarea>`;
  } else {
    input = `<input id="f_${f.key}" type="${f.type||'text'}" value="${esc(val)}" ${f.step?'step="'+f.step+'"':''} ${f.readonly?'readonly':''}>`;
  }
  return `<div class="field${cls}"><label>${esc(f.label)}</label>${input}</div>`;
}
function readField(key){ const el=document.getElementById('f_'+key); return el?el.value:''; }

function renderRecordTable(cfg){
  const state = UI[cfg.tabKey];
  const all = cfg.data();
  const q = (state.search||'').toLowerCase();
  const rows = all.filter(r=> cfg.matchesFilter(r,state.filter) && (!q || cfg.searchText(r).toLowerCase().includes(q)) );
  const editable = cfg.editable;
  let html = `<div class="toolbar">
    <input class="search-input" placeholder="${cfg.searchPlaceholder||'Search...'}" value="${esc(state.search)}" data-action="rt-search" data-id="${cfg.tabKey}">
    ${cfg.filters.map(f=>`<button class="filter-chip ${state.filter===f.key?'active':''}" data-action="rt-filter" data-id="${cfg.tabKey}|${f.key}">${f.label}</button>`).join('')}
    <div class="tb-spacer"></div>
    ${editable? `<button class="btn btn-primary" data-action="rt-add" data-id="${cfg.tabKey}">${ICONS.plus} Add</button>`:''}
    <button class="btn" data-action="rt-export" data-id="${cfg.tabKey}">${ICONS.download} Export CSV</button>
  </div>
  <div class="glass table-wrap"><table><thead><tr>
    <th class="checkbox-cell"><input type="checkbox" data-action="rt-selall" data-id="${cfg.tabKey}" ${rows.length && rows.every(r=>state.sel.has(cfg.idOf(r)))?'checked':''}></th>
    ${cfg.columns.map(c=>`<th>${c.label}</th>`).join('')}
    ${editable?'<th></th>':''}
  </tr></thead><tbody>
  ${rows.map(r=>{
    const id=cfg.idOf(r);
    return `<tr data-action="rt-rowclick" data-id="${cfg.tabKey}|${esc(id)}">
      <td class="checkbox-cell"><input type="checkbox" data-action="rt-selrow" data-id="${cfg.tabKey}|${esc(id)}" ${state.sel.has(id)?'checked':''}></td>
      ${cfg.columns.map(c=>`<td class="${c.wrap?'wrap':''}">${c.get(r)}</td>`).join('')}
      ${editable?`<td><button class="row-del" data-action="rt-delrow" data-id="${cfg.tabKey}|${esc(id)}">${ICONS.close}</button></td>`:''}
    </tr>`;
  }).join('') || `<tr><td colspan="20" style="padding:24px;text-align:center;color:var(--text-dim);">No records found.</td></tr>`}
  </tbody></table></div>
  ${state.sel.size? `<div class="glass bulk-bar"><span>${state.sel.size} selected</span><div class="tb-spacer"></div><button class="btn btn-danger" data-action="rt-bulkdel" data-id="${cfg.tabKey}">Delete selected</button><button class="btn" data-action="rt-clearsel" data-id="${cfg.tabKey}">Clear selection</button></div>`:''}
  `;
  document.getElementById('content').innerHTML = html;
}

function toast(msg, type, actionLabel, actionFn){
  const t=document.createElement('div');
  t.className='toast glass';
  t.style.color = type==='error' ? '#ff9296' : (type==='success' ? '#7fe0a0' : 'var(--text)');
  const span=document.createElement('span'); span.textContent=msg; t.appendChild(span);
  if(actionLabel && actionFn){
    const b=document.createElement('button'); b.className='btn btn-sm'; b.textContent=actionLabel; b.style.color='var(--text)';
    b.onclick=()=>{ actionFn(); t.remove(); };
    t.appendChild(b);
  }
  document.getElementById('toast-stack').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, actionLabel?5000:2600);
}

function fyLabel(dateStr){
  if(!dateStr) return 'Unknown';
  const d=new Date(dateStr+'T00:00:00');
  let y=d.getFullYear();
  if((d.getMonth()+1) < (DB.settings.fyStart||4)) y-=1;
  return 'FY '+y+'/'+String((y+1)%100).padStart(2,'0');
}
function barRow(label, value, max, color){
  const pct = max>0 ? Math.max(2,Math.round((value/max)*100)) : 0;
  return `<div class="cost-row"><span>${esc(label)}</span><b>${fmtMoney(value)}</b></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color||'var(--primary)'}"></div></div>`;
}
function renderCosts(){
  const quotes = DB.quotes;
  const fyMap = {};
  quotes.forEach(q=>{
    const fy = fyLabel(q.dateRequested);
    fyMap[fy] = fyMap[fy] || {quoted:0, committed:0, actual:0};
    fyMap[fy].quoted += quoteTotal(q);
    if(['Accepted','Completed'].includes(q.status)) fyMap[fy].committed += quoteTotal(q);
    if(q.invoiced==='Yes') fyMap[fy].actual += (Number(q.invoiceAmount)||0) + (Number(q.vat)||0);
  });
  const fyKeys = Object.keys(fyMap).sort();

  const assetMap={};
  quotes.forEach(q=>{ if(!q.assetId) return; assetMap[q.assetId]=(assetMap[q.assetId]||0)+quoteTotal(q); });
  const assetRows = Object.entries(assetMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const assetMax = assetRows.length? assetRows[0][1] : 0;

  const catMap={};
  quotes.forEach(q=>{ catMap[q.category]=(catMap[q.category]||0)+quoteTotal(q); });
  const catMax = Math.max(1,...Object.values(catMap));

  const reactive = quotes.filter(q=>q.category==='Reactive').reduce((s,q)=>s+quoteTotal(q),0);
  const planned = quotes.filter(q=>q.category==='Planned').reduce((s,q)=>s+quoteTotal(q),0);
  const ratioTotal = reactive+planned;
  const reactivePct = ratioTotal? Math.round((reactive/ratioTotal)*100) : 0;
  let commentary;
  if(ratioTotal===0) commentary='No reactive or planned spend recorded yet.';
  else if(reactivePct>=60) commentary='Reactive spend dominates ('+reactivePct+'%). Consider investing more in planned maintenance to reduce emergency callouts.';
  else if(reactivePct<=35) commentary='Planned spend dominates ('+(100-reactivePct)+'%) — a healthy sign of proactive facilities management.';
  else commentary='A reasonable balance between reactive and planned spend ('+reactivePct+'% reactive).';

  const withInvoice = quotes.filter(q=>q.invoiceAmount!=='' && q.invoiceAmount!=null);
  const variances = withInvoice.map(q=>quoteVariance(q));
  const avgVar = variances.length? variances.reduce((a,b)=>a+b,0)/variances.length : 0;
  const overBudget = variances.filter(v=>v>0).length;
  const underBudget = variances.filter(v=>v<0).length;
  const totalVar = variances.reduce((a,b)=>a+b,0);

  const contMap={};
  quotes.forEach(q=>{
    if(!q.contractor) return;
    contMap[q.contractor] = contMap[q.contractor] || {jobs:0, spend:0, variances:[]};
    contMap[q.contractor].jobs++;
    contMap[q.contractor].spend += quoteTotal(q);
    const v=quoteVariance(q); if(v!=null) contMap[q.contractor].variances.push(v);
  });
  const contRows = Object.entries(contMap).sort((a,b)=>b[1].spend-a[1].spend);

  document.getElementById('content').innerHTML = `
    <div class="cost-grid">
      <div class="glass cost-card">
        <h3>Spend by financial year</h3>
        ${fyKeys.length? fyKeys.map(fy=>`<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:700;margin-bottom:4px;">${fy}</div>
          <div class="cost-row"><span>Quoted</span><b>${fmtMoney(fyMap[fy].quoted)}</b></div>
          <div class="cost-row"><span>Committed</span><b>${fmtMoney(fyMap[fy].committed)}</b></div>
          <div class="cost-row"><span>Actual</span><b>${fmtMoney(fyMap[fy].actual)}</b></div></div>`).join('') : '<div style="color:var(--text-dim);font-size:12.5px;">No quotes recorded yet.</div>'}
      </div>
      <div class="glass cost-card">
        <h3>Spend by asset</h3>
        ${assetRows.length? assetRows.map(([id,val])=>{ const a=DB.assets.find(x=>x.id===id); return barRow((a?a.description:id), val, assetMax, 'var(--primary)'); }).join('') : '<div style="color:var(--text-dim);font-size:12.5px;">No asset-linked spend yet.</div>'}
      </div>
      <div class="glass cost-card">
        <h3>Spend by category</h3>
        ${Object.keys(catMap).length? Object.entries(catMap).map(([c,v])=>barRow(c,v,catMax,'#5b8def')).join('') : '<div style="color:var(--text-dim);font-size:12.5px;">No data yet.</div>'}
      </div>
      <div class="glass cost-card">
        <h3>Reactive vs planned</h3>
        ${barRow('Reactive', reactive, Math.max(reactive,planned,1), 'var(--st-overdue)')}
        ${barRow('Planned', planned, Math.max(reactive,planned,1), 'var(--st-compliant)')}
        <p style="font-size:12.5px;color:var(--text-dim);margin-top:12px;line-height:1.5;">${commentary}</p>
      </div>
      <div class="glass cost-card">
        <h3>Quote vs invoice variance</h3>
        <div class="cost-row"><span>Quotes invoiced</span><b>${withInvoice.length}</b></div>
        <div class="cost-row"><span>Total variance</span><b>${fmtMoney(totalVar)}</b></div>
        <div class="cost-row"><span>Average variance</span><b>${fmtMoney(avgVar)}</b></div>
        <div class="cost-row"><span>Over budget</span><b>${overBudget}</b></div>
        <div class="cost-row"><span>Under / on budget</span><b>${underBudget + (withInvoice.length-overBudget-underBudget)}</b></div>
      </div>
      <div class="glass cost-card">
        <h3>Contractor summary</h3>
        ${contRows.length? contRows.map(([name,d])=>`<div class="cost-row"><span>${esc(name)} <span style="color:var(--text-dim)">(${d.jobs} jobs)</span></span><b>${fmtMoney(d.spend)}</b></div>`).join('') : '<div style="color:var(--text-dim);font-size:12.5px;">No data yet.</div>'}
      </div>
    </div>
  `;
}
RENDERERS.costs = renderCosts;

  'Are there any confined spaces on site (plant rooms, tanks, crypts, roof voids)?',
  'Does the building have a bell tower or bells requiring separate structural inspection?',
  'Are external hirers permitted to bring their own equipment, and is this covered by the church\'s risk assessments?'
];
function renderGuide(){
  const s=DB.settings;
  document.getElementById('content').innerHTML = `
    <div class="guide-prose">
      <h3>Adding an asset</h3>
      <p>Go to <b>Add Asset</b> in the sidebar. Choose <i>One at a time</i> for a single item — pick a category and the asset ID is generated automatically. Use <i>Paste a list</i> to add several assets at once by typing one per line as <code>description, category, location</code>. You can also add an asset directly from the <b>Asset Register</b> using the Add button.</p>
      <h3>Logging a maintenance task</h3>
      <p>Open <b>Maintenance Schedule</b> and click Add, or click any task to edit it. Set the frequency and the date it was last completed — CCI CAFM automatically calculates the next due date and status. Use the <i>Done today</i> button on the Dashboard or inside a task's drawer to log completion quickly.</p>
      <h3>Adding a quote</h3>
      <p>Open <b>Quote Tracker</b> and click Add. Record the contractor, cost and validity date. As the quote progresses, update its status through Requested → Received → Accepted (or Rejected). Marking a quote as invoiced and entering the invoice amount lets Cost Analysis calculate the variance automatically.</p>
      <h3>What the colours mean</h3>
      <ul>
        <li><b>Red — Overdue.</b> The due date has passed.</li>
        <li><b>Amber — Due soon.</b> Within the "soon" threshold below.</li>
        <li><b>Yellow — Watch.</b> Within the "watch" threshold below.</li>
        <li><b>Green — Compliant.</b> Not due for some time, or recently completed.</li>
        <li><b>Grey — No date.</b> No date has been logged yet.</li>
      </ul>
      <h3>18 questions to answer before relying on the statutory schedule</h3>
      <p>The pre-loaded maintenance schedule covers common statutory duties for a place of worship in England, but every building is different. Work through these questions with your facilities team before treating the schedule as complete:</p>
      <ol>${STATUTORY_QUESTIONS.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
    </div>

    <h3 style="margin-top:8px;">Settings</h3>
    <div class="settings-num-grid">
      <div class="field"><label>Financial year start (month)</label><input type="number" min="1" max="12" id="set-fyStart" value="${s.fyStart}"></div>
      <div class="field"><label>Due soon threshold (days)</label><input type="number" min="1" id="set-soon" value="${s.soon}"></div>
      <div class="field"><label>Watch threshold (days)</label><input type="number" min="1" id="set-watch" value="${s.watch}"></div>
      <div class="field"><label>Contract lead time (days)</label><input type="number" min="0" id="set-lead" value="${s.lead}"></div>
    </div>

    <h3>Data</h3>
    <div class="glass card">
      <p style="font-size:12.5px;color:var(--text-dim);">Back up your data regularly. Backups include all records and appearance settings, but never sign-in details.</p>
      <div class="data-actions">
        <button class="btn btn-primary" data-action="guide-backup">${ICONS.download} Back up to file</button>
        <button class="btn" data-action="guide-restore-btn">${ICONS.upload} Restore from file</button>
        <input type="file" id="guide-restore-input" accept="application/json" hidden>
        <button class="btn" data-action="guide-print">${ICONS.print} Print</button>
      </div>
      <div class="danger-zone glass" style="margin-top:18px;">
        <b style="color:#ff9296;">Danger zone</b>
        <p style="font-size:12.5px;color:var(--text-dim);margin:6px 0 12px;">This replaces all current records with the original CCI CAFM sample data. This cannot be undone.</p>
        <button class="btn btn-danger" data-action="guide-restart">Start again with sample data</button>
      </div>
    </div>
  `;
  ['fyStart','soon','watch','lead'].forEach(key=>{
    document.getElementById('set-'+key).addEventListener('change', e=>{
      const v=Number(e.target.value); if(!isNaN(v)){ DB.settings[key]=v; saveDB(); toast('Settings updated', 'success'); refreshCurrentTab(); }
    });
  });
  document.getElementById('guide-restore-input').addEventListener('change', e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data.assets || !data.maintenance){ toast('This does not look like a CCI CAFM backup file', 'error'); return; }
        DB = data; saveDB(); applyAppearance(); toast('Data restored from backup', 'success'); startApp(false);
      }catch(err){ toast('Could not read backup file', 'error'); }
    };
    reader.readAsText(file);
  });
}
ACTIONS['guide-backup']=()=>{
  const blob=new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='cci-cafm-backup-'+iso(TODAY)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded', 'success');
};
ACTIONS['guide-restore-btn']=()=>document.getElementById('guide-restore-input').click();
ACTIONS['guide-print']=()=>window.print();
ACTIONS['guide-restart']=()=>{
  openModal({title:'Start again with sample data', body:'This permanently replaces every asset, maintenance task, renewal, quote and contractor with the original CCI CAFM sample data.', confirmLabel:'Start again', danger:true, onConfirm:()=>{
    DB = seedDB(); saveDB(); applyAppearance(); toast('Sample data restored', 'success'); startApp(false);
  }});
};
RENDERERS.guide = renderGuide;

function init(){
  applyAppearance();
  populateLogin();
  const sid = localStorage.getItem(LS_SESSION);
  const existing = sid ? AUTH.users.find(u=>u.id===sid) : null;
  if(existing){
    SESSION = existing;
    startApp(existing.mustChangePin);
  } else {
    document.getElementById('login-screen').hidden=false;
    document.getElementById('app').hidden=true;
  }
}
init();
</script>
</body>
</html>
